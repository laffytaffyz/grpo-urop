data:
  tokenizer: null
  train_files: null
  val_files: null
  prompt_key: prompt
  max_prompt_length: 512
  max_response_length: 512
  train_batch_size: 1024
  val_batch_size: 1312
  return_raw_input_ids: False  # This should be set to true when the tokenizer between policy and rm differs
  return_raw_chat: False
trainer:
  algo: es
  total_generations: 200
  population_size: 64
  noise_std: 0.02
  learning_rate: 0.05
  antithetic: true
  fitness_shaping: rank       # options: rank, centered, zscore
  print_every: 10
  logger: ['wandb']
  nnodes: 1
  n_gpus_per_node: 4
  save_freq: 50
  test_freq: 50
  project_name: null
  experiment_name: null
  default_hdfs_dir: null
  default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}
actor_rollout_ref:
  model:
    path: null
    dtype: bfloat16
    external_lib: null
    enable_gradient_checkpointing: false
    use_remove_padding: false
  rollout:
    name: hf                        # hf is faster to swap weights than vllm
    path: ${actor_rollout_ref.model.path}
    dtype: ${actor_rollout_ref.model.dtype}
    do_sample: true
    n: 1
    temperature: 0.7
    top_k: 0                           # 0 for HF, -1 for vLLM
    top_p: 0.9
    prompt_length: ${data.max_prompt_length}
    response_length: ${data.max_response_length}
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.4
    log_prob_micro_batch_size: 128     # if you compute logprobs for diagnostics
  actor:
    path: ${actor_rollout_ref.model.path}
    algo: ${trainer.algo}
    adv_estimator: gae
    strategy: fsdp  # This is for backward-compatibility
    ppo_mini_batch_size: 256
    ppo_micro_batch_size: 64
    use_dynamic_bsz: False
    ppo_max_token_len_per_gpu: 16384 # n * ${data.max_prompt_length} + ${data.max_response_length}
    grad_clip: 1.0
    clip_ratio: 0.2
    entropy_coeff: 0.001
    use_kl_loss: False # True for GRPO
    kl_loss_coef: 0.001 # for grpo
    kl_loss_type: low_var_kl # for grpo
    ppo_epochs: 1
    shuffle: False
    ulysses_sequence_parallel_size: 1 # sp size
    optim:
      lr: 1e-6
      lr_warmup_steps_ratio: 0.  # the total steps will be injected during runtime
      min_lr_ratio: null   # only useful for warmup with cosine
      warmup_style: constant  # select from constant/cosine
      total_training_steps: -1  # must be override by program
    fsdp_config:
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
      param_offload: False
      grad_offload: False
      optimizer_offload: False
      fsdp_size: -1
      model_dtype: bfloat16 # change by tiffany
dist:
  launcher: accelerate
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 1
reward_model:
  enable: False
  strategy: fsdp
  model:
    input_tokenizer: ${actor_rollout_ref.model.path}  # set this to null if the chat template is identical
    path: ~/models/FsfairX-LLaMA3-RM-v0.1
    external_lib: ${actor_rollout_ref.model.external_lib}
    use_remove_padding: False
    fsdp_config:
      min_num_params: 0
      param_offload: False
  micro_batch_size: 64
  max_length: null
  ulysses_sequence_parallel_size: 1 # sp size
  use_dynamic_bsz: False
  forward_max_token_len_per_gpu: 32768