data:
  tokenizer: null
  train_files: null
  val_files: null
  prompt_key: prompt
  max_prompt_length: 512
  max_response_length: 512
  train_batch_size: 1024
  val_batch_size: 1312
  return_raw_input_ids: False  # This should be set to true when the tokenizer between policy and rm differs
  return_raw_chat: False
model:
  path: null
  dtype: bfloat16
  external_lib: null
  enable_gradient_checkpointing: false
  use_remove_padding: false
trainer:
  algo: es
  population_size: 64
  noise_std: 0.02
  fitness_shaping: rank  # or centered, zscore
  optimizer: sgd         # optional for xNES/CMA variants
  grad_accum: 1
  eval_every: 100

trainer:
  algo: es
  total_epochs: 30
  total_generations: 10000
  population_size: 64
  noise_std: 0.02
  learning_rate: 0.05
  antithetic: true
  fitness_shaping: rank
  project_name: null
  experiment_name: null
  logger: ['console','wandb']
  nnodes: 1
  n_gpus_per_node: 4
  save_freq: -1
  test_freq: -1
  eval_batch_size: 128               # eval prompts for tracking true progress
  clip_norm: null                    # optional, if you convert g to fp16/bf16
  default_hdfs_dir: ~/experiments/gsm8k/ppo/${trainer.experiment_name}
  default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}

rollout:
  backend: hf                        # hf is faster to swap weights than vllm
  path: ${model.path}
  dtype: ${model.dtype}
  do_sample: true
  n: 1
  temperature: 1.0
  top_k: 0                           # 0 for HF, -1 for vLLM
  top_p: 1.0
  prompt_length: ${data.max_prompt_length}
  response_length: ${data.max_response_length}
  tensor_model_parallel_size: 1
  gpu_memory_utilization: 0.4
  log_prob_micro_batch_size: 128     # if you compute logprobs for diagnostics
dist:
  launcher: accelerate
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 1